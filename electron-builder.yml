# 설치 파일 만들기 (P4-02). `npm run dist` 로 지금 컴퓨터용을 만든다. 맥과 윈도우는 GitHub Actions 에서.
# 앱 고유 ID 를 붙여야 화면 기록 권한, 로그인 시 실행이 개발용 Electron 과 섞이지 않는다.
# 이름이 짝꿍에서 페어리(fairy)로 바뀌며 ID 도 fairy.moilga.com 에 맞춰 바꿨다 (2026-10-11, 아직 공개 릴리스 전이라
# 이어 받을 설치가 없다). 예전 ID(io.github.milcho0604.jjakkung)로 깐 시험판은 따로 지운다 (docs/install.md)
appId: com.moilga.fairy
# 실행 파일과 앱 묶음 이름은 영문이어야 한다. 한글로 두면 Electron 44 가 켜지자마자 죽는다 (L20).
# 영어 이름은 늘 소문자 fairy. 사람 눈에 보이는 이름만 한글로: 맥은 CFBundleDisplayName, 윈도우는 바로 가기와 프로그램 목록 이름.
productName: fairy
# 설치 파일 이름은 영문으로 둔다. 한글 파일 이름은 내려받기와 명령줄에서 깨지기 쉽다.
artifactName: fairy-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  # 무료 AI 엔진(node-llama-cpp, v2)은 미리 빌드된 것만 쓴다. 소스 빌드용 파일은 뺀다 (41MB 중 약 34MB).
  # 실행에 필요한 건 dist, llama 의 정보 파일(binariesGithubRelease.json, llama.cpp.info.json, package.json), grammars
  - "!node_modules/node-llama-cpp/llama/{gitRelease.bundle,addon,cmake,CMakeLists.txt,patches,toolchains,xpack,profiles}{,/**}"
  - "!node_modules/node-llama-cpp/{templates,bins}{,/**}"
  - "!node_modules/node-llama-cpp/**/*.{map,d.ts,md}"
  # 무료 AI 엔진의 운영체제별 패키지(@node-llama-cpp/linux-x64 등, 압축해도 5~11MB)는 넣지 않는다. 처음 무료 AI 모델을
  # 받을 때 npm 원본 묶음을 해시를 맞춰 같이 받는다 (src/shared/llama-bins.ts, src/main/llama-bins.ts, 2026-10-11).
  # GPU 판(cuda, vulkan, 윈도우는 합쳐 약 620MB)도 같이 빠진다
  - "!node_modules/@node-llama-cpp{,/**}"
  # ipull(node-llama-cpp 의 모델 받기, 페어리는 쓰지 않는다)이 파일 복사 때만 부르는 네이티브 모듈
  - "!node_modules/@reflink{,/**}"
  # 실행에 쓰지 않는 파일: 소스 맵, 타입 선언, 설명서, 시험, 예제, C 헤더 (node-addon-api 는 소스 빌드용).
  # 라이선스 파일(LICENSE*)은 남긴다
  - "!node_modules/**/*.{map,d.ts,d.mts,d.cts,markdown,h,hpp,cc,gyp,gypi}"
  - "!node_modules/**/{README,readme,Readme,CHANGELOG,changelog,HISTORY,CONTRIBUTING}*"
  - "!node_modules/**/{test,tests,__tests__,example,examples,.github}{,/**}"
# 화면 말은 한국어와 영어뿐이라 Electron 언어 파일(맥 .lproj, 윈도우 locales/*.pak)도 둘만 둔다 (앱 20MB 쯤 줄임).
# en-US 는 크로미엄 기본이라 꼭 둔다
electronLanguages: [ko, en, en-US, en-GB]
# 설치 파일을 최대로 줄인다 (빌드는 조금 느려진다)
compression: maximum
# 다른 운영체제, 다른 칩의 네이티브 패키지를 뺀다 (scripts/prune-native.mjs). 맥은 Apple 칩 앱과 인텔 앱이
# 같은 node_modules 로 만들어져 두 칩 것을 다 가졌다. 서명(afterSign) 전에 돈다
afterPack: ./scripts/prune-native.mjs
# koffi 는 Node-API 라 Electron 용으로 다시 빌드할 필요가 없다. 다시 빌드하면 윈도우 러너에서 컴파일러를 찾는다.
npmRebuild: false
# Electron 퓨즈 (실행 파일에 박는 켜고 끄기, @electron/fuses). 서명 바로 전에 뒤집힌다 (2026-10-11 보안 점검).
# - runAsNode 는 켜 둔다: 페어리 MCP 서버를 페어리 실행 파일로 띄운다 (ELECTRON_RUN_AS_NODE, src/main/mcp-launch.ts).
#   끄면 AI 대화의 페어리 도구와 "다른 AI 에 붙이기"가 멈춘다. 대신 누구든 페어리 실행 파일을 Node 처럼 쓸 수 있다는
#   뜻이지만 그건 그 컴퓨터에서 이미 프로그램을 돌릴 수 있는 사람에게만 해당하고, 맥 화면 기록 권한을 빌려 쓰는
#   길은 Node 모드에서 열리지 않는다(권한은 창을 띄우는 앱 쪽에 묶인다). docs/release.md "Electron 퓨즈"
# - NODE_OPTIONS 와 --inspect 류 인자는 막는다: 설치판에 디버거를 붙여 페어리 권한(화면 기록, 토큰)을 빌리지 못하게.
#   개발 실행(npx electron .)과 시험 창(CLAUDE.md, --inspect)은 퓨즈가 없는 Electron 이라 그대로 된다.
# - 앱은 app.asar 에서만 읽고, 맥과 윈도우는 asar 무결성(빌드 때 해시)을 확인한다. 리눅스는 무결성 퓨즈를 무시한다.
# - grantFileProtocolExtraPrivileges 와 쿠키 암호화는 기본값 그대로 둔다: 창과 모델 파일(file://)을 file:// 에서 읽고,
#   쿠키 암호화는 한 번 켜면 되돌릴 수 없다. 바꿀 때는 설치판으로 모든 창과 모델 받기를 시험한다.
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # 맥 arm64 는 퓨즈를 뒤집으면 임시 서명이 깨진다. 다시 임시 서명한 뒤 afterSign(mac-sign.mjs)이 자체 인증서로 서명한다
  resetAdHocDarwinSignature: true
# 오픈소스 고지 (scripts/third-party-notices.mjs 가 npm run dist 앞에 만든다). 설정 → 정보에서 연다.
# 앱 자원 폴더(process.resourcesPath)에 둔다: asar 안이면 운영체제의 글 보기 앱이 열지 못한다
extraResources:
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# 맥 앱 고정 서명 (mac 아래 identity 설명 참고). dmg 를 만들기 전에 돈다
afterSign: ./scripts/mac-sign.mjs
# 네이티브 파일은 운영체제별 패키지(@koromix/koffi-win32-x64 등)에 들어 있다.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
  # 무료 AI 엔진 (운영체제별 네이티브 패키지는 처음 쓸 때 userData 에 받는다)
  - node_modules/node-llama-cpp/**
  # 페어리 MCP 서버는 AI 도구가 실행 파일을 Node 로 돌려 연다. asar 밖에 둔다 (나눠진 조각까지 out/main 통째로).
  - out/main/**
# fairy:// 주소 (단축어, Raycast, Alfred, PowerToys 에서 부르기, docs/integrations.md). 맥은 Info.plist 의
# CFBundleURLTypes, 윈도우는 설치할 때 레지스트리에 들어간다. 받는 쪽은 src/main/open-handler.ts, 검사는 shared/url-scheme.ts
# 예전 이름 jjakkung:// 도 같이 등록한다: 만들어 둔 단축어, Raycast 명령이 그대로 돈다
protocols:
  - name: fairy
    schemes: [fairy, jjakkung]
# .fairy 페어리 파일을 두 번 누르면 페어리가 가져온다 (페어리 가져오기와 같은 검사와 확인 창, backup.ts importPet).
# 예전 이름 때 .jjpet 도 같이 연결한다 (안의 모양은 같다, docs/pet-format.md)
fileAssociations:
  - ext: fairy
    name: fairy file
    description: 페어리 파일
    mimeType: application/x-fairy
    role: Viewer
  - ext: jjpet
    name: fairy file (old)
    description: 페어리 파일 (예전 .jjpet)
    mimeType: application/x-jjakkung-pet
    role: Viewer
mac:
  category: public.app-category.productivity
  target:
    # dmg 는 처음 설치용, zip 과 latest-mac.yml 은 자동 업데이트(electron-updater, Squirrel.Mac)가 받는다
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 개발자 서명 전(D4)이라 electron-builder 는 임시 서명(-)만 하고, afterSign 의 scripts/mac-sign.mjs 가
  # 늘 같은 자체 인증서로 다시 서명한다. 임시 서명만 두면 업데이트마다 화면 기록 권한이 풀린다 (L23).
  # 처음 열 때 뜨는 확인되지 않은 개발자 경고를 넘기는 법은 설치 안내(P4-03)에.
  identity: "-"
  # 강화 런타임은 공증(D4) 때 켠다. 임시 서명과 같이 켜면 라이브러리 검사에 걸려 안 열린다.
  hardenedRuntime: false
  # 내 컴퓨터에서 그리기의 sd.cpp 엔진 (인텔 Mac, macOS 12~13). scripts/build-sdcpp.mjs 가 칩마다 만든 sd-cli 를
  # 앱 안 Contents/Resources/sd/sd-cli 로 넣는다. ${arch} 는 electron-builder 이름(arm64, x64)이라 빌드 폴더도 그 이름.
  # 빌드 전이면(npm run dist:mac 만 돌림) 빠지고, 앱은 그 엔진을 감춘다. 서명은 scripts/mac-sign.mjs 가 따로 한다
  extraResources:
    - from: resources-bin/sd/${arch}/
      to: sd/
      filter:
        - sd-cli
        - LICENSE.txt
    # 권한 창 안내 글을 맥 언어에 맞춘다 (Info.plist 기본값은 영어, 한국어 맥은 ko.lproj)
    - from: build/mac/en.lproj/InfoPlist.strings
      to: en.lproj/InfoPlist.strings
    - from: build/mac/ko.lproj/InfoPlist.strings
      to: ko.lproj/InfoPlist.strings
  extendInfo:
    CFBundleDisplayName: 페어리
    # 화면 위 페어리 앱이라 Dock 에 안 뜬다 (코드에서 app.dock.hide 도 한다. 이건 켜질 때 잠깐 뜨는 것까지 막는다).
    LSUIElement: true
    # 기본값은 영어. 한국어 맥은 ko.lproj/InfoPlist.strings 의 글을 보인다 (build/mac)
    NSScreenCaptureUsageDescription: Used by Look Together to show the screen area you pick to the AI.
# 리눅스: 압축 파일(tar.xz, 풀어서 실행)과 AppImage. snap 은 만들지 않는다 (스토어 심사, 샌드박스가 화면 캡처와 AI CLI 를 막는다).
# 리눅스는 자동 업데이트가 없다 (src/shared/update-policy.ts AUTO_INSTALL_PLATFORMS). 새 버전은 페어리가 릴리스 페이지를 연다
linux:
  target:
    - target: tar.xz
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Utility
  executableName: fairy
  synopsis: A little fairy on your screen that works with you
  # 리눅스 바로 가기(.desktop)의 Comment 로 들어간다 (desktop.entry 의 Comment 보다 앞선다). 한국어는 Comment[ko]
  description: A little fairy on your screen that keeps your to-dos, notes and calendar
  # 설치된 .desktop 이름을 package.json desktopName 과 맞춰 작업 표시줄이 같은 앱으로 묶는다
  syncDesktopName: true
  # 언어가 맞지 않는 데스크톱(독일어, 일본어 등)은 꾸밈 없는 Name 을 보인다. 그래서 기본은 영어 fairy, 한국어 데스크톱만 페어리
  # (맥의 Info.plist 기본 영어 + ko.lproj 와 같은 짜임)
  desktop:
    entry:
      Name: fairy
      Name[ko]: 페어리
      Comment: A little fairy on your screen that works with you
      Comment[ko]: 화면 위 페어리와 같이 일하는 데스크톱 앱
      Keywords: todo;calendar;notes;assistant;fairy;할일;일정;메모;페어리;
      StartupWMClass: fairy
win:
  target:
    - target: nsis
      arch: [x64]
# 윈도우 설치: 한 번 누르면 이 사용자에게만 바로 깔린다 (관리자 권한 없음, %LOCALAPPDATA%\Programs\fairy).
# 바탕 화면과 시작 메뉴에 "페어리" 바로 가기, 다 깔리면 바로 켠다. 설치, 지우기 말은 윈도우 언어가 한국어면 한국어, 아니면 영어
# (목록 첫째가 기본). 지울 때 데이터(%APPDATA%\fairy)는 남기고, 지우기 직전에 남긴다는 것과 폴더를 알린다 (build/installer.nsh).
# 업데이트(electron-updater)는 옛 판을 --updated 로 조용히 지워 그 안내가 뜨지 않는다
nsis:
  oneClick: true
  perMachine: false
  shortcutName: 페어리
  uninstallDisplayName: 페어리
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages: [en_US, ko_KR]
  include: build/installer.nsh
# dmg 창: 왼쪽 페어리를 오른쪽 응용 프로그램 폴더로 끌어 넣는다. 아래 가운데는 설치 안내 웹 링크. 바탕은 앱 창의 밝은 바탕색(--bg #fbf8f4, 새 그림 없이 색만).
# ULFO(lzfse) 압축은 기본(UDZO, zlib)보다 작고 빨리 열린다. macOS 10.11 부터 열려서 페어리(macOS 12 이상)는 괜찮다
dmg:
  title: 페어리 ${version}
  format: ULFO
  backgroundColor: '#fbf8f4'
  iconSize: 96
  window:
    width: 540
    height: 440
  contents:
    - x: 150
      y: 180
      type: file
    - x: 390
      y: 180
      type: link
      path: /Applications
    # 처음 열 때 "악성 코드가 없음을 확인할 수 없습니다" 창에서 막힌 사람이 누르는 웹 링크 (애플 개발자 서명과 공증 전).
    # 앱이 열리기 전이라 앱 안에서는 안내할 수 없어 dmg 안에 둔다. 주소는 src/shared/update-policy.ts INSTALL_HELP_URL.darwin
    # 과 같다 (update-policy.test.ts). 이름은 dmg 하나를 두 언어가 같이 써서 한국어와 영어를 같이 적는다
    - x: 270
      y: 340
      type: file
      path: build/mac/install-help.webloc
      name: 열리지 않으면 여기 (If it won't open).webloc
# 자동 설치(electron-updater)가 읽을 latest.yml(윈도우), latest-mac.yml(맥)과 차이 받기용 .blockmap 을 같이 만든다.
# 레포는 공개 레포 fairy-releases = src/shared/update-policy.ts 의 RELEASE_REPO (다르면 시험이 깨진다).
# 소스 레포가 아니다: 소스 레포는 비공개가 될 수 있다 (docs/release.md "두 레포").
# 올리기는 하지 않는다: 스크립트가 --publish never 로 돌고, 릴리스 초안은 release.yml 의 gh 가 만든다.
publish:
  provider: github
  owner: milcho0604
  repo: fairy-releases
