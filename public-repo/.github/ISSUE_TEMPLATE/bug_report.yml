name: 버그 알리기 (Bug report)
description: 페어리가 이상하게 움직여요 / Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        고마워요! **보안 문제는 여기 올리지 말고** [SECURITY.md](https://github.com/milcho0604/fairy-releases/blob/main/SECURITY.md) 방법으로 알려 주세요.
        진짜 할 일 제목, 이메일, 토큰 같은 개인정보는 지우고 올려 주세요.
        Please report security issues privately (see SECURITY.md) and remove personal data.
  - type: input
    id: version
    attributes:
      label: 판 (Version)
      description: 설정 → 정보 맨 아래 (Settings → About)
      placeholder: '0.2.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 운영체제 (OS)
      options:
        - macOS (Apple 칩 / Apple silicon)
        - macOS (인텔 / Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 운영체제 판 (OS version)
      placeholder: macOS 15.1 / Windows 11 24H2 / Ubuntu 24.04
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 (What happened)
      description: 무엇을 했고, 무엇을 기대했고, 실제로 어땠는지 / steps, expected, actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 진단 기록 (Diagnostics, optional)
      description: 설정 → 정보 → 내 기록 → "진단 기록도 같이 붙이기" → 이대로 복사. 경로, 토큰, 이메일 등은 가려져 있어요.
      render: text
