<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 앱 아이콘 원본. 고치면 `npx electron scripts/build-icon.mjs` 로 icon.png 를 다시 만든다. -->
  <!-- 맥 아이콘 격자: 1024 안에 824 판, 둘레 100 여백. 얼굴은 펫 화면 기본 펫(PetFace)과 같다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ec" />
      <stop offset="1" stop-color="#f2dfc6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)" />
  <g transform="translate(512 540) scale(15) translate(-20 -19)">
    <ellipse cx="20" cy="19" rx="18" ry="15.5" fill="#ffd8a8" stroke="#c4854a" stroke-width="1.5" />
    <ellipse cx="13.5" cy="17" rx="1.7" ry="2" fill="#1f2328" />
    <ellipse cx="26.5" cy="17" rx="1.7" ry="2" fill="#1f2328" />
    <ellipse cx="9.5" cy="22" rx="3" ry="1.8" fill="rgba(255,140,140,.45)" />
    <ellipse cx="30.5" cy="22" rx="3" ry="1.8" fill="rgba(255,140,140,.45)" />
    <path d="M17.5 21.5q2.5 2.4 5 0" fill="none" stroke="#1f2328" stroke-width="1.3" stroke-linecap="round" />
  </g>
</svg>
