<!doctype html><meta charset="utf-8"><body>
<script src="../../node_modules/onnxruntime-web/dist/ort.webgpu.min.js"></script>
<script>
const { ipcRenderer } = require('electron');
const log = (...a) => ipcRenderer.send('log', ...a);
ort.env.wasm.wasmPaths = new URL('../../node_modules/onnxruntime-web/dist/', location.href).href;
const MODELS = [
  { id: 'u2netp', file: 'u2netp.onnx', size: 320, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], sigmoid: false },
  { id: 'u2net', file: 'u2net.onnx', size: 320, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], sigmoid: false },
  { id: 'isnet', file: 'isnet-general-use.onnx', size: 1024, mean: [0.5, 0.5, 0.5], std: [1, 1, 1], sigmoid: false },
  { id: 'birefnet', file: 'BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx', size: 1024, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], sigmoid: true },
];
function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
// rembg 의 normalize 와 같게: 크기 맞추고, 가장 밝은 값으로 나누고, 채널별 평균과 표준편차
function toTensor(img, m) {
  const c = new OffscreenCanvas(m.size, m.size); const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, m.size, m.size);
  const d = g.getImageData(0, 0, m.size, m.size).data;
  let max = 1e-6; for (let i = 0; i < d.length; i += 4) max = Math.max(max, d[i], d[i + 1], d[i + 2]);
  const n = m.size * m.size; const f = new Float32Array(3 * n);
  for (let p = 0; p < n; p++) for (let ch = 0; ch < 3; ch++) f[ch * n + p] = (d[p * 4 + ch] / max - m.mean[ch]) / m.std[ch];
  return new ort.Tensor('float32', f, [1, 3, m.size, m.size]);
}
function toMask(out, m) {
  const n = m.size * m.size; const v = new Float32Array(n);
  for (let i = 0; i < n; i++) v[i] = m.sigmoid ? 1 / (1 + Math.exp(-out.data[i])) : out.data[i];
  let mi = Infinity, ma = -Infinity; for (const x of v) { mi = Math.min(mi, x); ma = Math.max(ma, x); }
  const c = new OffscreenCanvas(m.size, m.size); const g = c.getContext('2d'); const im = g.createImageData(m.size, m.size);
  for (let i = 0; i < n; i++) { const a = Math.max(0, Math.min(1, (v[i] - mi) / (ma - mi || 1))) * 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = 255; im.data[i * 4 + 3] = a; }
  g.putImageData(im, 0, 0); return c;
}
async function cutout(img, mask) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = new OffscreenCanvas(w, h); const g = c.getContext('2d');
  g.drawImage(img, 0, 0); g.globalCompositeOperation = 'destination-in'; g.imageSmoothingQuality = 'high'; g.drawImage(mask, 0, 0, w, h);
  // 바둑판 위에 얹어 투명한 곳이 보이게
  const o = new OffscreenCanvas(w, h); const og = o.getContext('2d');
  for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) { og.fillStyle = ((x + y) / 16) % 2 ? '#c8c8c8' : '#f4f4f4'; og.fillRect(x, y, 16, 16); }
  og.drawImage(c, 0, 0);
  const blob = await o.convertToBlob({ type: 'image/jpeg', quality: 0.85 });
  return await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
}
(async () => {
  const { photos, B } = await ipcRenderer.invoke('list');
  const result = { gpu: !!navigator.gpu, models: {} };
  for (const m of MODELS) {
    const r = (result.models[m.id] = { load: {}, runs: {} });
    for (const ep of ['webgpu', 'wasm']) {
      try {
        const t0 = performance.now();
        const s = await ort.InferenceSession.create(`file://${B}/models/${m.file}`, { executionProviders: [ep] });
        r.load[ep] = Math.round(performance.now() - t0);
        const times = [];
        for (const p of photos) {
          const img = await load(`file://${B}/photos/${p}`);
          const t1 = performance.now();
          const out = await s.run({ [s.inputNames[0]]: toTensor(img, m) });
          const mask = toMask(out[s.outputNames[0]], m);
          times.push(Math.round(performance.now() - t1));
          if (ep === 'webgpu') await ipcRenderer.invoke('save', `${m.id}__${p.replace(/\.\w+$/, '')}.jpg`, await cutout(img, mask));
          if (ep === 'wasm' && times.length >= 2) break; // wasm 은 시간만 재고 두 장에서 멈춘다
        }
        r.runs[ep] = times;
        await s.release();
        log(m.id, ep, 'load', r.load[ep], 'runs', times.join(','));
      } catch (e) { r.runs[ep] = String(e.message ?? e).slice(0, 200); log(m.id, ep, 'ERR', r.runs[ep]); }
    }
  }
  ipcRenderer.invoke('done', result);
})();
</script>
