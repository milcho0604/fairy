# 홈서버(맥미니) 운영용. 모일까(compose 이름 moilga, 3001)와 같은 Docker 에 나란히 뜬다.
# 이름, 포트, 볼륨, 백업 경로는 모두 fairy 전용이라 moilga 를 건드리지 않는다.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# 밖으로는 API 만 127.0.0.1:3002 에 연다. Cloudflare Tunnel 이 fairy-api.moilga.com 을 여기로 보낸다.
name: fairy

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fairy-postgres
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env.prod 에 넣어야 한다}
      POSTGRES_DB: ${POSTGRES_DB:-fairy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fairy} -d ${POSTGRES_DB:-fairy}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # 빌드 맥락은 레포 루트. 서버와 공유 규칙 src/shared/coin-rules.ts 만 들어간다 (server/Dockerfile.dockerignore)
      context: ..
      dockerfile: server/Dockerfile
    image: fairy-api
    container_name: fairy-api
    restart: unless-stopped
    # 끄라는 신호 뒤 진행 중인 AI 답(최대 2분 안팎)이 끝나기를 기다리는 시간. 기본 10초면 답이 도중에 잘린다
    stop_grace_period: 130s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-fairy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fairy}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 앱 안 운영자 화면을 쓸 구글 계정 sub (쉼표). 비면 운영자 계정 없음
      ADMIN_GOOGLE_SUBS: ${ADMIN_GOOGLE_SUBS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 비우면 공식 주소, Haiku 5.5, 월 90달러, 하루 20번, 질문 8000자 (server/src/config.ts)
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-}
      # 첫 로그인 선물과 하루 수를 세는 HMAC 비밀. 비면 선물만 꺼진다
      GIFT_HMAC_KEY: ${GIFT_HMAC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://fairy-api.moilga.com}
      # 카카오 로그인 (6단계). 기능 키 FEATURE_KAKAO_LOGIN 이 off(기본)면 키가 있어도 꺼진다
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      FEATURE_KAKAO_LOGIN: ${FEATURE_KAKAO_LOGIN:-off}
      # 서버 백업 (5단계). 비면 백업 경로만 503. 파일은 아래 fairy_backups 볼륨에 암호화해 둔다
      BACKUP_ENC_KEY: ${BACKUP_ENC_KEY:-}
      BACKUP_DIR: /data/backups
      # 밖에서 도는 백업(덤프, 외장 디스크 사본)이 결과를 남기는 폴더. 읽기만 한다 (운영자 홈의 백업 현황)
      BACKUP_STATUS_DIR: /data/backup-status
      # 서버 백업 전체 상한 (GB, 비우면 80). 넘으면 새 올리기는 507
      BACKUP_TOTAL_MAX_GB: ${BACKUP_TOTAL_MAX_GB:-}
      # 설정의 코인 초기화 (off 기본: 앱이 단추를 숨기고 서버도 초기화 기록을 거절)
      FEATURE_COIN_RESET: ${FEATURE_COIN_RESET:-off}
      # 다른 기기의 구글 일정 연결 안내 (#115, allowlist 기본: 허용 계정과 운영자 계정만)
      FEATURE_CALENDAR_LINK_HINT: ${FEATURE_CALENDAR_LINK_HINT:-allowlist}
      # 친구 (#110). 비면 allowlist(허용 계정과 운영자 계정). 운영자 화면 기능 스위치가 이긴다
      FEATURE_FRIENDS: ${FEATURE_FRIENDS:-allowlist}
      FEATURE_FRIEND_GIFTS: ${FEATURE_FRIEND_GIFTS:-allowlist}
      FEATURE_FRIEND_CALENDAR: ${FEATURE_FRIEND_CALENDAR:-allowlist}
      # 친구에게 채팅 이용권 선물 (보내는 사람, 받는 사람 모두 허용돼야 한다)
      FEATURE_FRIEND_GIFT_PASSES: ${FEATURE_FRIEND_GIFT_PASSES:-allowlist}
    volumes:
      - fairy_backups:/data/backups
      - fairy_backup_status:/data/backup-status:ro
    ports:
      - '127.0.0.1:3002:3002'

  # 매일 DB 를 외장 디스크로. 모일까 백업(04:30 UTC)과 한 시간 엇갈린다 (05:30 UTC = 14:30 KST).
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: fairy-backup
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-fairy}
      POSTGRES_USER: ${POSTGRES_USER:-fairy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '30 5 * * *'
      # 처리방침: 탈퇴한 사람의 DB 사본은 최대 7일. 이 이미지는 find -mtime +N 이라 N=6 이면 7일이 된 사본부터 지운다 (7이면 8일)
      # 주간, 월간 사본은 0 이어도 이미지가 하루 더 둔다 (이틀 안에 지워짐). 일 사본 7개가 전부다
      BACKUP_KEEP_DAYS: 6
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ${FAIRY_BACKUP_DIR:-/Volumes/milcho_ex/fairy-backups}:/backups

  # 서버 백업 파일(암호문)을 매일 06:00 UTC 에 외장 디스크로 (${FAIRY_BACKUP_DIR}/files). 지운 것도 맞춘다 (ops/backup-files).
  # 같은 컨테이너가 10분마다 위 backup 의 덤프(${FAIRY_BACKUP_DIR}/daily)가 제때 온전한지 보고, 두 작업의 성공과 실패를
  # fairy_backup_status 볼륨에 남긴다. 서버(api)가 읽기 전용으로 붙여 운영자 홈의 백업 현황으로 보인다
  backup-files:
    build:
      context: ./ops/backup-files
    image: fairy-backup-files
    container_name: fairy-backup-files
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    volumes:
      - fairy_backups:/src:ro
      - ${FAIRY_BACKUP_DIR:-/Volumes/milcho_ex/fairy-backups}:/dst
      - fairy_backup_status:/status

volumes:
  pgdata:
  # 서버 백업 파일 (AES-256-GCM 암호문). 매일 DB 백업(fairy-backup)에는 들지 않는다
  fairy_backups:
  # 밖에서 도는 백업의 결과 상태 파일 (backup-files 가 쓰고 api 가 읽는다)
  fairy_backup_status:
