# 페어리 서버 배포: server/ 가 바뀐 main push 때만 (또는 손으로). Tailscale 로 맥미니에 ssh 해
# server/ops/deploy.sh 를 돌린다. 운영 체크아웃의 커밋된 것만 빌드하고 /health 200 을 확인한다.
# 시크릿(TS_AUTHKEY, SSH_PRIVATE_KEY, SSH_HOST, SSH_USER)이나 변수 FAIRY_REPO_DIR 이 없으면 알림만 남기고 성공으로 끝난다.
# PR 에서는 돌지 않는다 (시크릿을 PR 에 쓰지 않는다).
name: server-deploy

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SECRETS: ${{ secrets.TS_AUTHKEY != '' && secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_HOST != '' && secrets.SSH_USER != '' && vars.FAIRY_REPO_DIR != '' }}
    steps:
      - name: 준비 확인
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::배포 시크릿이나 FAIRY_REPO_DIR 이 아직 없어 건너뛴다 (운영자 준비, 이슈 #97)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SECRETS == 'true'
        with:
          persist-credentials: false
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        if: env.HAS_SECRETS == 'true'
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: ssh 준비
        if: env.HAS_SECRETS == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' > ~/.ssh/config
      - name: 맥미니에서 올리기
        if: env.HAS_SECRETS == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FAIRY_REPO_DIR: ${{ vars.FAIRY_REPO_DIR }}
        run: |
          ssh -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "FAIRY_REPO_DIR='$FAIRY_REPO_DIR' bash -s -- '${{ github.sha }}'" < server/ops/deploy.sh
