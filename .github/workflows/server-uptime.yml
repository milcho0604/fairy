# 페어리 서버 밖 감시: 10분마다 https://fairy-api.moilga.com/health. 맥미니 전체가 꺼진 경우를 잡는다
# (맥미니 안의 fairy-monitor.sh 는 맥미니가 꺼지면 같이 꺼진다).
# 세 번 시도해도 실패하면 private 레포 milcho0604/fairy-alerts 에 이슈를 열고, 되살아나면 닫는다.
# 변수 FAIRY_API_LIVE=true (터널 연결 뒤)와 시크릿 ALERTS_TOKEN (fairy-alerts 이슈 쓰기 권한만 가진 토큰)이 있어야 돈다.
name: server-uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-uptime
  cancel-in-progress: false

jobs:
  ping:
    if: vars.FAIRY_API_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://fairy-api.moilga.com/health
      ALERTS_REPO: milcho0604/fairy-alerts
      HAS_TOKEN: ${{ secrets.ALERTS_TOKEN != '' }}
    steps:
      - id: ping
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 15 "$URL" || true)
            [ "$code" = 200 ] && break
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 200 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: 알림 토큰 확인
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::ALERTS_TOKEN 이 없어 fairy-alerts 에 이슈를 쓰지 못한다 (상태 ${{ steps.ping.outputs.code }})"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: env.HAS_TOKEN == 'true'
        env:
          OK: ${{ steps.ping.outputs.ok }}
          CODE: ${{ steps.ping.outputs.code }}
        with:
          github-token: ${{ secrets.ALERTS_TOKEN }}
          script: |
            const [owner, repo] = process.env.ALERTS_REPO.split('/');
            const label = 'uptime-down';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: label });
            if (process.env.OK === 'true') {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `✅ 밖에서 복구 확인 (${now}). 자동으로 닫습니다. [run](${run})` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
              return;
            }
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `🔴 여전히 다운 (${now}), 상태 ${process.env.CODE}. [run](${run})` });
              return;
            }
            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: `[자동] 페어리 서버 밖에서 다운 — ${now}`,
              body: [
                `GitHub Actions 가 밖에서 ${process.env.URL} 을 세 번 시도했지만 200 이 아니었습니다 (상태 ${process.env.CODE}).`,
                '',
                '맥미니 안의 감시(fairy-monitor)가 같은 때 이슈를 열지 않았다면 맥미니 자체, 전기, 집 인터넷, cloudflared 를 먼저 보세요.',
                '',
                '- `docker ps -a --filter name=fairy-`',
                '- `curl -s http://127.0.0.1:3002/health`',
                '- `pgrep -lf cloudflared`',
                '- `pmset -g`',
                '',
                `[run](${run}). 되살아나면 저절로 닫힙니다.`,
              ].join('\n'),
            });
