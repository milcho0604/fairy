# 실험 브랜치 전용: 앱의 실제 HF 클라이언트를 진짜 Space 에 돌려 본다. main 에는 넣지 않는다.
name: lab-app
on:
  push:
    branches: [lab/illustrate]
    paths: ['lab/app-run.ts', '.github/workflows/lab-app.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [cat-adult, poodle-teen, cat-baby]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ccr-04ba311d-ht78er
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node lab/app-run.ts
        env:
          JOB: ${{ matrix.job }}
        continue-on-error: true
      - name: 결과 올리기
        run: |
          git config user.name "jjakkung-lab"
          git config user.email "lab@users.noreply.github.com"
          git add -f lab/out-app
          git commit -m "lab: 앱 클라이언트 결과" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin lab/illustrate && git push -q origin HEAD:lab/illustrate && exit 0; sleep $((i*3)); done
