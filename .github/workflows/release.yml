# 설치 파일 만들기 (P4-02). 맥(dmg, 애플 실리콘과 인텔)과 윈도우(exe).
# 비공개 레포에서 맥 러너는 분이 10배로 깎여서 올릴 때마다 돌리지 않는다.
# - 손으로: Actions 탭 → release → Run workflow. 결과는 실행 화면의 Artifacts 에서 받는다.
# - 태그로: `git tag v0.1.0 && git push origin v0.1.0` 이면 GitHub Releases 에 초안으로 올린다.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        if: runner.os == 'macOS'
      # 인텔 맥 dmg 도 같이 만든다. koffi 네이티브 파일은 운영체제와 칩마다 다른 패키지라 x64 것을 더 받는다
      # (창 위에 올라앉기가 쓴다. 없으면 그 기능만 꺼진다).
      - run: npm install --no-save --force @koromix/koffi-darwin-x64@3.3.2
        if: runner.os == 'macOS'
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: jjakkung-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      # 초안으로 올린다. 확인한 뒤 GitHub 화면에서 발행한다.
      - run: gh release create "$GITHUB_REF_NAME" files/* --draft --title "짝꿍 $GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
