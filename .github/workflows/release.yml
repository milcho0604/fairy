# 설치 파일 만들기 (P4-02). 맥(dmg, 애플 실리콘과 인텔), 윈도우(exe), 리눅스(tar.xz, AppImage).
# 액션은 커밋 SHA 로 고정한다 (태그는 옮길 수 있다). 올릴 때는 주석의 태그와 SHA 를 같이 바꾼다.
# 릴리스 올리기(release 작업)는 GitHub 환경 release 의 승인을 받아야 돈다 (docs/release.md "환경 승인").
# - 손으로: Actions 탭 → release → Run workflow. 결과는 실행 화면의 Artifacts 에서 받는다.
# - 태그로: `git tag v0.2.0 && git push origin v0.2.0` 이면 GitHub Releases 에 초안으로 올린다.
#   먼저 사전 점검(scripts/release-check.mjs)이 태그 = package.json 버전, release/min-version, CHANGELOG 의
#   "## [0.2.0] - 날짜" 절을 본다. 틀리면 비싼 빌드(맥, 윈도우)를 돌리기 전에 멈춘다 (docs/release.md "릴리스 사전 점검").
#   올리기 전에는 파일 이름과 개수, 자동 업데이트 파일의 sha512 를 맞춰 보고 SHA256SUMS.txt 를 같이 올린다.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# 같은 브랜치에서 손으로 다시 돌리면 앞의 것은 멈춘다. 태그 릴리스는 도중에 멈추지 않는다
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 의존성 없이 돈다 (src/shared/release-meta.ts 만 읽는다). 손으로 돌릴 때는 태그가 없어 건너뛴다
      - run: node scripts/release-check.mjs tag "$GITHUB_REF_NAME"
        if: startsWith(github.ref, 'refs/tags/v')

  build:
    needs: preflight
    strategy:
      # 태그 릴리스는 한 운영체제라도 깨지면 올릴 수 없으니 나머지를 바로 멈춘다 (러너 시간 아끼기).
      # 손으로 돌릴 때는 운영체제마다 결과를 다 본다
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/v') }}
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 모든 운영체제에서 검사한다 (윈도우만 깨지는 경로, 줄바꿈 문제를 설치 파일 전에 잡는다)
      - run: npm run check
      # 인텔 맥 dmg 도 같이 만든다. koffi 네이티브 파일은 운영체제와 칩마다 다른 패키지라 x64 것을 더 받는다
      # (창 위에 올라앉기가 쓴다. 없으면 그 기능만 꺼진다).
      # 무료 AI 엔진(node-llama-cpp 의 칩별 패키지)은 설치 파일에 넣지 않고 앱이 처음 쓸 때 받는다 (src/shared/llama-bins.ts)
      - run: npm install --no-save --force @koromix/koffi-darwin-x64@3.3.2
        if: runner.os == 'macOS'
      # 내 컴퓨터에서 그리기의 sd.cpp 엔진: 인텔 Mac, macOS 12~13 용 sd-cli 를 칩마다 빌드해 앱에 넣는다
      # (공식 맥 묶음은 macOS 26 용이라 직접, scripts/build-sdcpp.mjs). 같은 커밋이면 캐시에서 바로
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: runner.os == 'macOS'
        with:
          path: |
            .cache/sdcpp
            resources-bin/sd
          key: sdcpp-${{ runner.os }}-${{ hashFiles('scripts/build-sdcpp.mjs') }}
      - run: node scripts/build-sdcpp.mjs --arch all
        if: runner.os == 'macOS'
      - run: npm run ${{ matrix.script }}
        # 맥 고정 서명 인증서 (scripts/mac-sign.mjs). 없으면 맥 빌드가 멈춘다. 윈도우는 안 쓴다
        env:
          JJ_MAC_SIGN_P12: ${{ secrets.JJ_MAC_SIGN_P12 }}
          JJ_MAC_SIGN_PASSWORD: ${{ secrets.JJ_MAC_SIGN_PASSWORD }}
          # 구글 캘린더에 쓰기 (docs/google-calendar.md). 없으면 그 기능만 숨는다
          JJ_GOOGLE_CLIENT_ID: ${{ secrets.JJ_GOOGLE_CLIENT_ID }}
          JJ_GOOGLE_CLIENT_SECRET: ${{ secrets.JJ_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fairy-${{ runner.os }}
          # 자동 설치(electron-updater)가 릴리스에서 읽는다. 윈도우는 latest.yml, exe, .blockmap.
          # 맥은 latest-mac.yml, zip, .blockmap (dmg 는 처음 설치용)
          path: |
            dist/*.tar.xz
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          # 릴리스로 옮기면 필요 없다. 손으로 돌린 것도 일주일이면 충분하다 (저장 공간 아끼기)
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 레포 설정 → Environments → release 에 승인할 사람(Required reviewers)을 두면 초안을 올리기 전에 멈추고 기다린다.
    # 태그만 올린 사람(또는 훔친 토큰)이 혼자 릴리스를 만들지 못하게 (docs/release.md "환경 승인")
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      # 파일 이름과 개수(12개), latest.yml / latest-mac.yml 의 버전과 sha512 를 실제 파일과 맞춰 보고
      # files/SHA256SUMS.txt 를 쓴다. 하나라도 틀리면 초안을 만들지 않는다
      - run: node scripts/release-check.mjs files "$GITHUB_REF_NAME" files
      # 초안으로 올린다. 확인한 뒤 GitHub 화면에서 발행한다.
      # 본문: 최소 버전 줄(release/min-version, 손으로 적지 않는다) + CHANGELOG 의 이 버전 절 + 체크섬 안내, 그 아래 자동 변경 목록.
      # 태그에 -beta.1 같은 꼬리가 있으면 사전 릴리스로 올린다 (앱의 업데이트 확인은 사전 릴리스를 보지 않는다)
      - run: |
          node scripts/release-check.mjs notes "$GITHUB_REF_NAME" > notes.md
          printf '\n받은 파일 확인: `SHA256SUMS.txt` 를 같은 폴더에 받아 `sha256sum -c SHA256SUMS.txt --ignore-missing` (맥은 `shasum -a 256 <파일>`, 윈도우는 `Get-FileHash <파일>` 값을 목록과 견주기)\n' >> notes.md
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" files/* --draft $pre --title "페어리 $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
