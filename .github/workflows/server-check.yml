# 페어리 서버(server/) 검사: 린트, 타입, 단위 시험, 시험용 Postgres 컨테이너로 통합 시험, 이미지 빌드.
# 앱 검사(check.yml)는 server/ 만 바뀐 것을 돌지 않는다. 시크릿은 쓰지 않는다.
name: server-check

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/shared/coin-rules.ts', 'src/shared/site-events.ts', 'src/shared/account-profile.ts', '.github/workflows/server-*.yml']
  pull_request:
    paths: ['server/**', 'src/shared/coin-rules.ts', 'src/shared/site-events.ts', 'src/shared/account-profile.ts', '.github/workflows/server-*.yml']

permissions:
  contents: read

concurrency:
  group: server-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      # 빌드 맥락은 레포 루트 (공유 규칙 src/shared/coin-rules.ts 를 함께 넣는다)
      - run: docker build -f Dockerfile -t fairy-api:ci ..
      # 배포(ops/deploy.sh)와 똑같이 커밋된 것에서 server/ 와 Dockerfile 이 COPY 하는 공용 파일만 꺼내 빌드한다.
      # 레포 전체로 빌드하면 꺼내는 목록에서 빠진 파일을 못 잡는다 (2026-10-15 #113 배포 실패).
      - name: 배포와 같은 방식으로 빌드
        working-directory: .
        run: |
          SRC=$(mktemp -d)
          SHARED=$(git show "HEAD:server/Dockerfile" | sed -n 's#^COPY \(src/shared/[^ ]*\) .*#\1#p')
          test -n "$SHARED"
          # shellcheck disable=SC2086
          git archive HEAD server $SHARED | tar -x -C "$SRC"
          docker build -f "$SRC/server/Dockerfile" -t fairy-api:deploy-like "$SRC"
      - name: 배포 스크립트 문법
        run: bash -n ops/deploy.sh && bash -n ops/fairy-monitor.sh && bash -n ops/install-monitor.sh
