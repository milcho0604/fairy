# 운영자 화면(/admin)에서 고친 이벤트 목록과 공지를 홈페이지 정적 파일로 올린다 (이슈 #101, 기획서 9, 23절).
# 10분마다 서버의 GET /v1/events.json, /v1/notices.json 을 받아 앱의 읽기 코드로 검사하고(scripts/site-feeds.mjs),
# site/events.json, site/notices.json 이 바뀌었으면 main 에 커밋한다. 홈페이지(Vercel)가 main 을 배포해 앱에 닿는다.
# - 검사에 하나라도 걸리면 아무것도 커밋하지 않고 실패로 끝난다 (Actions 알림 메일)
# - 서버가 꺼져 있으면 아무것도 바꾸지 않고 성공으로 끝난다 (홈페이지는 지난 파일 그대로)
# - 공개 레포 Actions 라 무료. 기본 GITHUB_TOKEN 만 쓴다 (새 토큰 없음). 변수 FAIRY_API_LIVE=true 일 때만 돈다
# - main 은 브랜치 보호(PR, 필수 검사)라 GITHUB_TOKEN 의 직접 push 가 막힐 수 있다. 막히면 bot/site-feeds 브랜치로
#   올려 PR 을 열어 둔다 (레포 설정 Actions > "Allow GitHub Actions to create and approve pull requests" 가 켜져 있어야 한다).
#   운영자가 그 PR 을 머지하면 배포된다. 자세한 것은 docs/release.md "공지 올리기"
# 액션은 커밋 SHA 로 고정한다 (check.yml 과 같은 판).
name: site-feeds

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-feeds
  cancel-in-progress: false

jobs:
  pull:
    if: vars.FAIRY_API_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: feeds
        name: 서버에서 받아 검사
        run: node scripts/site-feeds.mjs --api https://fairy-api.moilga.com --site site
      - name: 바뀌었으면 main 에 커밋
        if: steps.feeds.outputs.changed != ''
        env:
          CHANGED: ${{ steps.feeds.outputs.changed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/events.json site/notices.json
          git commit -q -m "site: 운영자 화면에서 고친 ${CHANGED} 올리기 (#101)" -m "서버 /v1/*.json 을 scripts/site-feeds.mjs 로 검사해 옮김. run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git fetch -q origin main
          git rebase -q origin/main
          if git push -q origin HEAD:main; then
            echo "::notice title=site-feeds::main 에 올림 (${CHANGED})"
            exit 0
          fi
          echo "::warning title=site-feeds::main 에 바로 올리지 못해(브랜치 보호) PR 로 올려요"
          git push -q -f origin HEAD:refs/heads/bot/site-feeds
          if [ -z "$(gh pr list --head bot/site-feeds --base main --state open --json number -q '.[].number')" ]; then
            gh pr create --head bot/site-feeds --base main \
              --title "site: 운영자 화면에서 고친 이벤트, 공지 올리기 (#101)" \
              --body "site-feeds 워크플로가 서버 /v1/events.json, /v1/notices.json 을 앱의 읽기 코드로 검사해 옮겼어요. 머지하면 홈페이지 배포로 앱에 닿아요. 새로 고친 것이 있으면 이 PR 에 덮어써요."
          fi
