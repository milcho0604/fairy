# 실험 브랜치 전용: 공개 정보 조회. main 에는 넣지 않는다.
name: lab-probe
on:
  push:
    branches: [lab/illustrate]
    paths: ['.github/workflows/lab-probe.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p lab/probe3
          for repo in leejet/FLUX.2-klein-4B-GGUF unsloth/Qwen3-4B-GGUF black-forest-labs/FLUX.2-small-decoder; do
            curl -sS "https://huggingface.co/api/models/$repo" | python3 -c "import json,sys; d=json.load(sys.stdin); print('$repo', d.get('sha'), d.get('lastModified'))" >> lab/probe3/shas.txt
          done
          cat lab/probe3/shas.txt
      - run: |
          git config user.name "jjakkung-lab"; git config user.email "lab@users.noreply.github.com"
          git add -f lab/probe3; git commit -qm "lab: probe3" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin lab/illustrate && git push -q origin HEAD:lab/illustrate && exit 0; sleep $((i*3)); done
