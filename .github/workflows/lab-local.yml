# 실험 브랜치 전용: 앱의 내 Mac에서 그리기 순서를 맥 러너에서. main 에는 넣지 않는다.
name: lab-local
on:
  push:
    branches: [lab/illustrate]
    paths: ['lab/local-run.ts', '.github/workflows/lab-local.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ccr-04ba311d-ht78er
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node lab/local-run.ts
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "jjakkung-lab"; git config user.email "lab@users.noreply.github.com"
          git add -f lab/out-local; git commit -qm "lab: 맥 로컬 순서" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin lab/illustrate && git push -q origin HEAD:lab/illustrate && exit 0; sleep $((i*3)); done
