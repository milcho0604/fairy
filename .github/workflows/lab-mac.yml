# 실험 브랜치 전용: 맥(Apple Silicon)에서 무료 로컬 그리기 (mflux, FLUX.2 klein 4B). main 에는 넣지 않는다.
name: lab-mac
on:
  push:
    branches: [lab/illustrate]
    paths: ['.github/workflows/lab-mac.yml', 'lab/mac-prompt.txt', 'lab/mac_cpu.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 기계 정보
        run: |
          mkdir -p lab/out-mac
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl -n hw.memsize; df -h /; } | tee lab/out-mac/machine.txt
      - name: uv 와 mflux 설치
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          /usr/bin/time -p uv tool install --python 3.12 mflux 2>&1 | tail -5 | tee lab/out-mac/install.txt
          ls ~/.local/bin | grep mflux | tee -a lab/out-mac/install.txt
          du -sh ~/.local/share/uv 2>/dev/null | tee -a lab/out-mac/install.txt
      - name: CPU 로 그리기 (사진 → 그림)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          PY="$HOME/.local/share/uv/tools/mflux/bin/python"
          /usr/bin/time -l "$PY" lab/mac_cpu.py lab/in_cat.png lab/out-mac/cpu-cat.png lab/mac-prompt.txt > lab/out-mac/cpu1.log 2>&1; tail -8 lab/out-mac/cpu1.log
      - name: CPU 로 털 다듬기 (Kontext 그림 → 털)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          PY="$HOME/.local/share/uv/tools/mflux/bin/python"
          /usr/bin/time -l "$PY" lab/mac_cpu.py lab/out-fur3/v0/cat-adult.webp lab/out-mac/cpu-fur.png lab/fur-prompt.txt > lab/out-mac/cpu2.log 2>&1; tail -8 lab/out-mac/cpu2.log
      - name: 결과 올리기
        if: always()
        run: |
          git config user.name "jjakkung-lab"; git config user.email "lab@users.noreply.github.com"
          rm -f lab/out-mac/cat-q4.png; git add -A -f lab/out-mac; git commit -qm "lab: 맥 로컬 그리기" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin lab/illustrate && git push -q origin HEAD:lab/illustrate && exit 0; sleep $((i*3)); done
