<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<script src="../config.js"></script>
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'IBM Plex Sans KR', sans-serif; color: #2b2119; }
  .card { position: relative; width: 1200px; height: 630px; background: linear-gradient(120deg, #f7e7d4 0%, #f3dcc6 42%, #efd2bf 78%, #ecccb9 100%); overflow: hidden; }
  .card::before { content: ''; position: absolute; inset: -30% 45% 20% -25%; background: radial-gradient(closest-side, rgb(255 246 234 / .75), transparent); }
  .copy { position: absolute; left: 84px; top: 92px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 6px 18px -6px rgb(74 55 38 / .45); }
  .names { display: flex; flex-direction: column; }
  .ko { font: 400 64px/1 'Jua'; }
  .en { font: 600 22px/1 'IBM Plex Sans KR'; color: #9f632c; margin-top: 8px; letter-spacing: .02em; }
  h1 { font: 400 58px/1.16 'Jua'; margin: 46px 0 0; }
  h1 span { color: #9f632c; }
  p { font-size: 25px; line-height: 1.55; margin: 22px 0 0; color: #4a3b2f; max-width: 470px; word-break: keep-all; }
  .chips { position: absolute; left: 84px; bottom: 56px; display: flex; gap: 10px; }
  .chips span { font-size: 19px; font-weight: 600; background: rgb(255 255 255 / .6); border: 1px solid rgb(255 255 255 / .8); padding: 7px 16px; border-radius: 999px; color: #4a3b2f; }
  .panel { position: absolute; right: 66px; top: 44px; width: 296px; border-radius: 12px; box-shadow: 0 2px 6px rgb(74 55 38 / .1), 0 40px 70px -28px rgb(74 55 38 / .55); }
  .kong { position: absolute; left: 672px; bottom: 4px; width: 200px; height: 150px; background: url(../assets/img/kong-sprite.webp) 0 0 / 2000px 1350px no-repeat; }
  .shadow { position: absolute; left: 712px; bottom: 4px; width: 120px; height: 16px; background: radial-gradient(closest-side, rgb(90 55 40 / .3), transparent); }
  .bubble { position: absolute; left: 560px; bottom: 152px; font-size: 21px; font-weight: 500; background: #fffaf3; border: 2px solid #a8764b; padding: 10px 18px; border-radius: 16px; white-space: nowrap; }
  .bubble::after { content: ''; position: absolute; left: 212px; bottom: -9px; width: 14px; height: 14px; margin-left: -7px; background: #fffaf3; border-right: 2px solid #a8764b; border-bottom: 2px solid #a8764b; transform: rotate(45deg); }
  .choco { position: absolute; right: 18px; bottom: 0; height: 190px; filter: drop-shadow(0 10px 12px rgb(74 55 38 / .2)); }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="brand"><img src="../assets/icons/icon-192.png" alt=""><div class="names"><span class="ko" id="ko"></span><span class="en" id="en"></span></div></div>
    <h1>화면 위에 사는<br><span>작은 페어리</span></h1>
    <p id="tag"></p>
  </div>
  <div class="chips"><span>macOS</span><span>Windows</span><span>무료, 회원 가입 없음</span></div>
  <img class="panel" src="../assets/img/hero-panel.webp" alt="">
  <div class="shadow"></div>
  <div class="kong"></div>
  <div class="bubble">할 일 하나 끝! 코인 5개 받았어</div>
  <img class="choco" src="../assets/img/choco-512.webp" alt="">
</div>
<script>
  var S = window.SITE;
  document.getElementById('ko').textContent = S.name.ko;
  document.getElementById('en').textContent = S.name.en === S.name.ko ? '' : S.name.en;
  document.getElementById('tag').textContent = '할 일, 일정, 메모를 같이 챙겨 줘요. 계정도 서버도 없이 내 컴퓨터 안에서.';
</script>
</body>
</html>
